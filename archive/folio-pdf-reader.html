<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Folio — read any PDF as a book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=Atkinson+Hyperlegible:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F0E2;
    --paper-sepia:#EFE1C6;
    --paper-dark:#18211C;
    --ink:#241F18;
    --ink-dark:#E7E2D6;
    --ink-soft:#6b6353;
    --pine:#26433A;
    --pine-deep:#1B322B;
    --brass:#B98F45;
    --brass-light:#D9B679;
    --rule:#ddd0b0;
    --reading-font: 'Literata', Georgia, serif;
    --reading-size: 19px;
    --reading-leading: 1.7;
    --page-bg: var(--paper);
    --page-ink: var(--ink);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--pine-deep);
    color:var(--ink);
    overflow:hidden;
  }

  #app{ height:100vh; display:flex; flex-direction:column; }

  /* ---------- Toolbar ---------- */
  #toolbar{
    background:var(--pine);
    color:var(--paper);
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 16px;
    flex-shrink:0;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
    z-index:5;
  }
  #wordmark{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
    letter-spacing:.02em;
    display:flex;
    align-items:baseline;
    gap:6px;
    flex-shrink:0;
  }
  #wordmark span{ color:var(--brass-light); font-style:italic; font-weight:500; font-size:14px; }
  #book-title{
    font-size:13px;
    color:var(--paper);
    opacity:.75;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex:1;
    min-width:0;
  }
  .toolbar-controls{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .tbtn{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    color:var(--paper);
    border-radius:6px;
    width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:14px;
    font-family:'Inter',sans-serif;
    transition:background .15s;
  }
  .tbtn:hover{ background:rgba(255,255,255,.18); }
  .tbtn:focus-visible, .navbtn:focus-visible, select:focus-visible, #upload-btn:focus-visible{
    outline:2px solid var(--brass-light); outline-offset:2px;
  }
  select#font-select, select#theme-select{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    color:var(--paper);
    border-radius:6px;
    height:30px;
    font-size:12px;
    font-family:'Inter',sans-serif;
    padding:0 6px;
    cursor:pointer;
  }
  select#font-select option, select#theme-select option{ color:#111; }
  #upload-btn{
    background:var(--brass);
    color:#1c1206;
    border:none;
    border-radius:6px;
    padding:0 12px;
    height:30px;
    font-size:12px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
    flex-shrink:0;
  }
  #upload-btn:hover{ background:var(--brass-light); }
  #file-input{ display:none; }

  /* ---------- Drop zone ---------- */
  #drop-zone{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
    color:var(--paper);
  }
  #drop-zone.dragover .dz-card{ border-color:var(--brass-light); background:rgba(255,255,255,.05); }
  .dz-card{
    max-width:440px;
    text-align:center;
    border:1.5px dashed rgba(246,240,226,.35);
    border-radius:14px;
    padding:48px 36px;
    transition:border-color .15s, background .15s;
  }
  .dz-card h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:0 0 10px;
  }
  .dz-card p{
    font-size:14px;
    line-height:1.6;
    color:rgba(246,240,226,.65);
    margin:0 0 22px;
  }
  .dz-icon{
    width:46px; height:56px;
    margin:0 auto 20px;
    border:2px solid var(--brass-light);
    border-radius:4px;
    position:relative;
  }
  .dz-icon::before{
    content:"";
    position:absolute; left:8px; right:8px; top:14px;
    height:2px; background:var(--brass-light); opacity:.5;
    box-shadow:0 8px 0 rgba(217,182,121,.5), 0 16px 0 rgba(217,182,121,.5), 0 24px 0 rgba(217,182,121,.35);
  }
  .dz-pick{
    background:var(--brass);
    color:#1c1206;
    border:none;
    border-radius:7px;
    padding:10px 20px;
    font-size:13px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
  }
  .dz-pick:hover{ background:var(--brass-light); }
  .dz-note{ margin-top:16px; font-size:12px; color:rgba(246,240,226,.4); }

  /* ---------- Loading ---------- */
  #loading{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--paper);
    gap:14px;
  }
  .spinner{
    width:28px; height:28px;
    border-radius:50%;
    border:3px solid rgba(246,240,226,.2);
    border-top-color:var(--brass-light);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  #loading-status{ font-size:13px; color:rgba(246,240,226,.7); }

  /* ---------- Reader ---------- */
  #reader{ flex:1; display:flex; flex-direction:column; min-height:0; background:var(--page-bg); transition:background .3s; }

  #viewport{
    flex:1;
    position:relative;
    overflow:hidden;
    min-height:0;
  }
  #content{
    height:100%;
    column-width:100vw;
    column-gap:72px;
    column-fill:auto;
    padding:6vh 8vw;
    color:var(--page-ink);
    font-family:var(--reading-font);
    font-size:var(--reading-size);
    line-height:var(--reading-leading);
    letter-spacing:.001em;
    text-align:left;
    will-change:transform;
    transition:transform .38s cubic-bezier(.65,0,.35,1);
  }
  #content h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.5em;
    line-height:1.25;
    margin:1.1em 0 .6em;
    break-after:avoid;
    break-inside:avoid;
  }
  #content p{
    margin:0 0 1em;
    text-align:justify;
    hyphens:auto;
    orphans:2;
    widows:2;
  }
  #content p:first-of-type::first-letter{
    font-family:'Fraunces',serif;
    font-weight:600;
  }

  .navbtn{
    position:absolute;
    top:0; bottom:0;
    width:64px;
    background:transparent;
    border:none;
    cursor:pointer;
    display:flex; align-items:center;
    font-size:22px;
    color:var(--page-ink);
    opacity:0;
    transition:opacity .15s, background .15s;
    z-index:3;
  }
  .navbtn:hover{ opacity:.55; background:linear-gradient(to var(--fade-dir,right), rgba(0,0,0,.05), transparent); }
  #prev-btn{ left:0; justify-content:flex-start; padding-left:10px; --fade-dir:right; }
  #next-btn{ right:0; justify-content:flex-end; padding-right:10px; --fade-dir:left; }

  /* ---------- Ribbon progress (signature element) ---------- */
  #ribbon-rail{
    position:absolute;
    top:0; right:18px;
    width:10px; height:100%;
    z-index:4;
    pointer-events:none;
  }
  #ribbon-rail::before{
    content:"";
    position:absolute; inset:0;
    background:var(--rule);
    opacity:.5;
    width:2px; left:4px;
  }
  #ribbon-fill{
    position:absolute; left:0; top:0; width:10px;
    background:linear-gradient(180deg, var(--brass-light), var(--brass));
    height:0%;
    transition:height .3s ease;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),50% 100%,0 calc(100% - 9px));
  }

  #status-bar{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:8px 16px;
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    color:var(--page-ink);
    opacity:.6;
    border-top:1px solid var(--rule);
  }
  #status-bar #page-label{ font-variant-numeric:tabular-nums; min-width:90px; text-align:center; }

  /* ---------- Themes ---------- */
  [data-theme="sepia"]{ --page-bg:var(--paper-sepia); --page-ink:#3a2f1c; --rule:#cbb385; }
  [data-theme="dark"]{ --page-bg:var(--paper-dark); --page-ink:var(--ink-dark); --rule:#33433a; }
  [data-theme="dark"] .navbtn{ color:var(--ink-dark); }
  [data-theme="dark"] #status-bar{ color:var(--ink-dark); }

  /* reading-font variants */
  [data-font="sans"]{ --reading-font:'Atkinson Hyperlegible', Arial, sans-serif; }
  [data-font="sans"] #content p{ text-align:left; hyphens:none; }

  @media (max-width:640px){
    #book-title{ display:none; }
    .dz-card{ padding:32px 22px; }
    #content{ column-gap:0; padding:4vh 6vw; }
    .navbtn{ width:44px; }
  }

  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
</style>
</head>
<body>

<div id="app">

  <header id="toolbar">
    <div id="wordmark">Folio<span>a pdf, read like a book</span></div>
    <div id="book-title"></div>
    <div class="toolbar-controls" id="reader-controls" hidden>
      <button class="tbtn" id="font-minus" title="Smaller text" aria-label="Decrease text size">A−</button>
      <button class="tbtn" id="font-plus" title="Larger text" aria-label="Increase text size">A+</button>
      <select id="font-select" aria-label="Reading typeface">
        <option value="serif">Serif</option>
        <option value="sans">Sans (accessible)</option>
      </select>
      <select id="theme-select" aria-label="Reading theme">
        <option value="light">Paper</option>
        <option value="sepia">Sepia</option>
        <option value="dark">Night</option>
      </select>
    </div>
    <button id="upload-btn"><span>＋</span> Upload PDF</button>
    <input type="file" id="file-input" accept="application/pdf,.pdf" />
  </header>

  <div id="drop-zone">
    <div class="dz-card">
      <div class="dz-icon"></div>
      <h1>Drop a PDF to start reading</h1>
      <p>Folio pulls the text out of your PDF and reflows it into clean, paginated book pages — no plugins, nothing leaves your browser.</p>
      <button class="dz-pick" id="dz-pick-btn">Choose a file</button>
      <div class="dz-note">Works best on text-based PDFs. Scanned image pages won't extract.</div>
    </div>
  </div>

  <div id="loading" hidden>
    <div class="spinner"></div>
    <div id="loading-status">Reading your PDF…</div>
  </div>

  <div id="reader" hidden>
    <div id="viewport">
      <div id="content" tabindex="0"></div>
      <button class="navbtn" id="prev-btn" aria-label="Previous page">‹</button>
      <button class="navbtn" id="next-btn" aria-label="Next page">›</button>
      <div id="ribbon-rail"><div id="ribbon-fill"></div></div>
    </div>
    <div id="status-bar">
      <span id="page-label">— / —</span>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
  "use strict";
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const $ = (id) => document.getElementById(id);
  const dropZone   = $('drop-zone');
  const loading    = $('loading');
  const loadingStatus = $('loading-status');
  const reader     = $('reader');
  const content    = $('content');
  const viewport   = $('viewport');
  const fileInput  = $('file-input');
  const uploadBtn  = $('upload-btn');
  const dzPickBtn  = $('dz-pick-btn');
  const bookTitleEl= $('book-title');
  const readerControls = $('reader-controls');
  const pageLabel  = $('page-label');
  const ribbonFill = $('ribbon-fill');
  const prevBtn    = $('prev-btn');
  const nextBtn    = $('next-btn');
  const fontMinus  = $('font-minus');
  const fontPlus   = $('font-plus');
  const fontSelect = $('font-select');
  const themeSelect= $('theme-select');

  let currentPage = 1;
  let totalPages = 1;
  let pageStep = 0; // column width + gap, in px
  let fontSizePx = 19;

  // ---------- File intake ----------
  uploadBtn.addEventListener('click', () => fileInput.click());
  dzPickBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (f) handleFile(f);
  });

  ['dragenter','dragover'].forEach(evt =>
    dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.add('dragover'); })
  );
  ['dragleave','drop'].forEach(evt =>
    dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); })
  );
  dropZone.addEventListener('drop', (e) => {
    const f = e.dataTransfer.files[0];
    if (f && f.type === 'application/pdf') handleFile(f);
  });

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function handleFile(file){
    dropZone.hidden = true;
    reader.hidden = true;
    loading.hidden = false;
    loadingStatus.textContent = 'Opening PDF…';
    try{
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;

      let title = file.name.replace(/\.pdf$/i,'');
      try{
        const meta = await pdf.getMetadata();
        if (meta && meta.info && meta.info.Title && meta.info.Title.trim()) title = meta.info.Title.trim();
      }catch(e){}
      bookTitleEl.textContent = title;

      const html = await extractBook(pdf, (p,n) => {
        loadingStatus.textContent = `Extracting page ${p} of ${n}…`;
      });

      content.innerHTML = html || '<p><em>No extractable text was found in this PDF — it may be scanned images rather than real text.</em></p>';

      loading.hidden = true;
      reader.hidden = false;
      readerControls.hidden = false;

      await document.fonts.ready;
      layout(true);
    }catch(err){
      console.error(err);
      loadingStatus.textContent = 'Something went wrong reading that PDF.';
      setTimeout(() => {
        loading.hidden = true;
        dropZone.hidden = false;
      }, 1800);
    }
  }

  // ---------- Text extraction + reflow heuristic ----------
  async function extractBook(pdf, onProgress){
    const parts = [];
    const numPages = pdf.numPages;
    for (let p = 1; p <= numPages; p++){
      onProgress(p, numPages);
      const page = await pdf.getPage(p);
      const textContent = await page.getTextContent();
      const items = textContent.items;

      const lines = [];
      let cur = null;
      const yTol = 2.2;

      for (const item of items){
        const str = item.str;
        const tr = item.transform;
        const y = tr[5];
        const height = Math.hypot(tr[2], tr[3]) || Math.abs(tr[3]) || 10;
        if (cur && Math.abs(cur.y - y) < yTol){
          cur.text += str;
          cur.h = Math.max(cur.h, height);
        } else {
          if (cur) lines.push(cur);
          cur = { y, text: str, h: height };
        }
      }
      if (cur) lines.push(cur);

      lines.sort((a,b) => b.y - a.y);

      const gaps = [];
      for (let i=1;i<lines.length;i++){
        const g = lines[i-1].y - lines[i].y;
        if (g > 0) gaps.push(g);
      }
      gaps.sort((a,b)=>a-b);
      const typicalGap = gaps.length ? gaps[Math.floor(gaps.length/2)] : 14;

      const heights = lines.map(l=>l.h).slice().sort((a,b)=>a-b);
      const bodySize = heights.length ? heights[Math.floor(heights.length/2)] : 10;

      let buf = [];
      const flush = () => {
        if (buf.length){
          const text = buf.join(' ').replace(/\s+/g,' ').trim();
          if (text) parts.push(`<p>${escapeHtml(text)}</p>`);
          buf = [];
        }
      };

      let prevY = null;
      for (const line of lines){
        const text = line.text.trim();
        if (!text) continue;
        const isHeading = line.h > bodySize * 1.35 && text.length < 90;
        const gap = prevY !== null ? (prevY - line.y) : typicalGap;
        const isNewPara = prevY !== null && gap > typicalGap * 1.6;

        if (isHeading){
          flush();
          parts.push(`<h2>${escapeHtml(text)}</h2>`);
        } else {
          if (isNewPara) flush();
          buf.push(text);
        }
        prevY = line.y;
      }
      flush();
    }
    return parts.join('\n');
  }

  // ---------- Pagination via CSS columns ----------
  function layout(resetToStart){
    const prevProgress = totalPages > 1 ? (currentPage - 1) / (totalPages - 1) : 0;
    const w = viewport.clientWidth;
    const gap = 72;
    content.style.columnGap = gap + 'px';
    content.style.columnWidth = w + 'px';
    content.style.transform = 'translateX(0px)';
    pageStep = w + gap;
    // force reflow before measuring
    void content.offsetWidth;
    const scrollW = content.scrollWidth;
    totalPages = Math.max(1, Math.round(scrollW / pageStep));

    if (resetToStart){
      currentPage = 1;
    } else {
      currentPage = Math.min(totalPages, Math.max(1, Math.round(prevProgress * (totalPages - 1)) + 1));
    }
    render();
  }

  function render(){
    content.style.transform = `translateX(${-(currentPage - 1) * pageStep}px)`;
    pageLabel.textContent = `${currentPage} / ${totalPages}`;
    const pct = totalPages > 1 ? ((currentPage - 1) / (totalPages - 1)) * 100 : 100;
    ribbonFill.style.height = pct + '%';
    prevBtn.style.visibility = currentPage <= 1 ? 'hidden' : 'visible';
    nextBtn.style.visibility = currentPage >= totalPages ? 'hidden' : 'visible';
  }

  function goTo(delta){
    currentPage = Math.min(totalPages, Math.max(1, currentPage + delta));
    render();
  }

  prevBtn.addEventListener('click', () => goTo(-1));
  nextBtn.addEventListener('click', () => goTo(1));

  document.addEventListener('keydown', (e) => {
    if (reader.hidden) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') goTo(1);
    if (e.key === 'ArrowLeft'  || e.key === 'PageUp')   goTo(-1);
  });

  let touchStartX = null;
  viewport.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].clientX; }, {passive:true});
  viewport.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) goTo(dx < 0 ? 1 : -1);
    touchStartX = null;
  }, {passive:true});

  let resizeTimer;
  window.addEventListener('resize', () => {
    if (reader.hidden) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => layout(false), 150);
  });

  // ---------- Controls ----------
  fontMinus.addEventListener('click', () => { fontSizePx = Math.max(13, fontSizePx - 1); applyFontSize(); });
  fontPlus.addEventListener('click',  () => { fontSizePx = Math.min(28, fontSizePx + 1); applyFontSize(); });
  function applyFontSize(){
    content.style.setProperty('--reading-size', fontSizePx + 'px');
    document.documentElement.style.setProperty('--reading-size', fontSizePx + 'px');
    layout(false);
  }

  fontSelect.addEventListener('change', () => {
    document.documentElement.setAttribute('data-font', fontSelect.value === 'sans' ? 'sans' : '');
    layout(false);
  });

  themeSelect.addEventListener('change', () => {
    document.documentElement.setAttribute('data-theme', themeSelect.value);
  });

})();
</script>
</body>
</html>
